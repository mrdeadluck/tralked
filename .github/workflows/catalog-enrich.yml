# Enriches the catalog straight against the production database (lib/sync/enrich.ts): official media
# (IGDB, SteamGridDB) of the games still without it and Steam user review totals, most popular first.
# Daily at 04:37 UTC (01:37 in Brasília) for 0.6 h (input `hours`, or the repository variable
# CATALOG_ENRICH_HOURS): after the 03:29 platform-import window and before the 05:23 cron, so it
# never runs with another worker. The free Neon plan has 100 CU-h a month (app/README.md, "Workers").
# Needs the repository secrets DATABASE_URL, IGDB_CLIENT_ID, IGDB_CLIENT_SECRET and SGDB_API_KEY.
name: catalog-enrich

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to work (keep it short: the database stays awake meanwhile)"
        required: true
        default: "0.6"

concurrency:
  group: catalog-enrich
  cancel-in-progress: false

jobs:
  enrich:
    # The hourly Vercel Cron `workers` starts this job (app/src/lib/cron/workers.ts). The schedule
    # above is a fallback, skipped once the repository variable DISPATCH_FROM_VERCEL is "true".
    if: github.event_name != 'schedule' || vars.DISPATCH_FROM_VERCEL != 'true'
    runs-on: ubuntu-latest
    # Scheduled runs: the window plus setup. By hand: up to 5.5 h.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 350 || 60 }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Enrich the catalog
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          APP_URL: https://tralked.com
          HOURS: ${{ github.event.inputs.hours || vars.CATALOG_ENRICH_HOURS || '0.6' }}
        run: |
          # Production mode asks for these two; the worker signs nothing, so throwaway values do.
          export SESSION_SECRET="$(openssl rand -hex 32)" CRON_SECRET="$(openssl rand -hex 16)"
          pnpm catalog:enrich --hours "$HOURS"
