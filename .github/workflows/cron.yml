# Runs the app's cron routes BY HAND (gh workflow run cron.yml -f jobs="users releases").
# Their schedule lives in app/vercel.json (Vercel Cron, since 02/11/2026): GitHub's scheduled
# runs are best-effort and went silent for 12 h that day. The worker workflows (platform-import,
# steam-details, ...) keep their GitHub schedules: they run for minutes to hours, not as functions.
name: cron

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run now (space-separated)"
        required: true
        default: "users"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Call cron routes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://tralked.com' }}
          MANUAL: ${{ github.event.inputs.jobs }}
        run: |
          JOBS="$MANUAL"
          status=0
          for job in $JOBS; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 310 \
              -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$job")
            echo "$job → $code $(head -c 300 /tmp/out.json)"
            [ "$code" = "200" ] || status=1
          done
          exit $status
