# Scheduled jobs for the production site (the Vercel Hobby plan only runs daily crons).
# Each schedule calls the app's cron route with the CRON_SECRET repository secret.
# Times are UTC. GitHub delays (and under load skips) scheduled runs at busy minutes (:00, :15,
# :30, :45), so every schedule here and in the worker workflows sits on an odd, quiet minute, and
# the workers start right after a cron run (the free Neon database is awake then) and never
# overlap each other. The whole timetable is in app/README.md ("Workers no GitHub Actions").
name: cron

on:
  schedule:
    - cron: "17 */6 * * *"    # users (libraries, achievements, hours), releases, media
    - cron: "23 1-23/2 * * *" # steam-catalog, news, platforms, igdb-catalog
    - cron: "19 3 * * *"      # catalog, rarity, highscores, notifications
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run now (space-separated)"
        required: true
        default: "users"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Call cron routes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://tralked.com' }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.jobs }}
        run: |
          case "$SCHEDULE" in
            "17 */6 * * *") JOBS="users releases media" ;;
            "23 1-23/2 * * *") JOBS="steam-catalog news platforms igdb-catalog" ;;
            "19 3 * * *") JOBS="catalog rarity highscores notifications" ;;
            *) JOBS="$MANUAL" ;;
          esac
          status=0
          for job in $JOBS; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 310 \
              -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$job")
            echo "$job → $code $(head -c 300 /tmp/out.json)"
            [ "$code" = "200" ] || status=1
          done
          exit $status
