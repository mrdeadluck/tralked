# Indexes the Sony trophy lists straight against the production database
# (scripts/psn-catalog-worker.ts, lib/sync/psn-catalog.ts): walks the npCommunicationIds
# NPWR00001_00, NPWR00002_00, … asking Sony's `trophyGroups` for each (ONE request every 2 s, never
# faster; it backs off on 429/5xx and ends the run cleanly, keeping its place in SyncCursor
# `psn-catalog-scan`), stores name, console and trophy counts in the light PsnCatalogList table, then
# links the lists whose name is that of exactly one PlayStation catalog game. Trophies are never read here.
# ~60.5k ids at 0.5 requests/s (1-2 requests per id): about 1,000 ids per run, 3 runs a day, a lap in ~3 weeks; a finished
# lap is not repeated for 30 days.
# Runs at 10:03, 16:03 and 22:03 UTC: even hours with no other job (the odd-hour crons start at :17/:23
# and platform-import at :29, so a run of at most 55 min ends before them), see the table in app/README.md.
# Needs the repository secrets DATABASE_URL (Neon, unpooled) and PSN_NPSSO (the service account's).
name: psn-catalog

on:
  schedule:
    - cron: "3 10,16,22 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to spend (scan + linking)"
        required: true
        default: "50"

concurrency:
  group: psn-catalog
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Index the Sony trophy lists
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          APP_URL: https://tralked.com
          MINUTES: ${{ github.event.inputs.minutes || '50' }}
        run: |
          # Production mode asks for these two; the worker signs nothing, so throwaway values do.
          export SESSION_SECRET="$(openssl rand -hex 32)" CRON_SECRET="$(openssl rand -hex 16)"
          pnpm psn:catalog --minutes "$MINUTES"
