# Indexes the Sony trophy lists straight against the production database
# (scripts/psn-catalog-worker.ts, lib/sync/psn-catalog.ts): walks the npCommunicationIds
# NPWR00001_00, NPWR00002_00, … asking Sony's `trophyGroups` for each (ONE request every 3 s, never
# faster: psnawp's 300 per 15 min; it backs off on 429/5xx and ends the run cleanly, keeping its place
# in SyncCursor `psn-catalog-scan`), stores name, console and trophy counts in the light PsnCatalogList
# table and, only when the repository variable PSN_CATALOG_MATCH is "true", links the lists whose name
# is that of exactly one PlayStation catalog game (otherwise it runs with --no-match: off by default
# until `pnpm psn-catalog:match-check` was read). Trophies are never read here.
# A slice Sony throttles (429/5xx after the retries) or refuses with 403 on 3 different ids pauses every
# Sony call of the site for 4 h (SyncCursor `psn-scan-cooldown`, which the game pages respect too); the
# runs in that time exit 0 without scanning (the pages' own 1 h `psn-open-cooldown` never skips a run).
# A single refused id is passed over and asked again later. 400s on 3 different new ids end the run
# as "rejected" with exit 1 (red: Sony's API may have changed), without a pause.
# The scan holds the rows it reads in memory and writes them once, at the end of the slice (one
# transaction), so Neon sleeps while it walks (the free plan has 100 CU-h a month); a cancel (SIGTERM)
# still writes them.
# ~60.5k ids at 0.33 requests/s (1-2 requests per id): about 700 ids per 50-minute slice, 7 slices a
# day, a lap in ~12 days; a finished lap is not repeated for 30 days.
# Slots (UTC): :20 of 0, 6, 10, 12, 16, 18 and 22 h, 50 min each, over before the :23 jobs of the next
# odd hour (and after platform-import, which ends by :16 of the even hour).
# GitHub often starts a run 10-30 min late, so the worker computes its window from the real start time
# (psnSliceMinutes): 50 min, cut to end 2 min before the next job of the timetable in app/README.md
# starts (:17 at 0/6/12/18, 03:19, :23 of odd hours, :28 at 2/8/14/20 and 04:28 when the :28 dispatcher
# starts steam-details and catalog-enrich); with under 5 min left, or inside platform-import's window
# (odd :21 to even :16), it exits 0 without scanning. A manual run passes minutes.
# Needs the repository secrets DATABASE_URL (Neon, unpooled) and PSN_NPSSO (the service account's).
name: psn-catalog

on:
  schedule:
    - cron: "20 0,6,10,12,16,18,22 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to spend (scan + linking); empty: by the time of day"
        required: false
        default: ""

concurrency:
  group: psn-catalog
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Index the Sony trophy lists
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          APP_URL: https://tralked.com
          MINUTES: ${{ github.event.inputs.minutes }}
          # Matching (catalog lists -> games) is off unless the repository variable says "true".
          NO_MATCH: ${{ vars.PSN_CATALOG_MATCH != 'true' && '--no-match' || '' }}
        run: |
          # Production mode asks for these two; the worker signs nothing, so throwaway values do.
          export SESSION_SECRET="$(openssl rand -hex 32)" CRON_SECRET="$(openssl rand -hex 16)"
          if [ -n "$MINUTES" ]; then pnpm psn:catalog --minutes "$MINUTES" $NO_MATCH; else pnpm psn:catalog $NO_MATCH; fi
