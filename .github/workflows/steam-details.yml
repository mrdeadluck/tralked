# Fills in Steam store details (summary, studio, dates, art, achievements) of the catalog games
# players need and the most popular ones, straight against the production database, so the Vercel
# function quota stays for the site.
# Games players need (opened, owned, wished), then the most popular; the long tail is filled only
# when someone opens its page (the free database holds 1 GB). Every 6 h at :37 of hours 2, 8, 14
# and 20 (UTC), in a short window: 0.6 h with 3 games in flight by default (inputs, or the
# repository variables STEAM_DETAILS_HOURS / STEAM_DETAILS_CONCURRENCY). It used to run 5.5 h of
# every 6 with 8 games in flight, which alone kept the free Neon compute awake ~22 h a day (its
# quota is 100 CU-h a month) and made it scale up. The window ends before the :23 cron and the :29
# platform-import of the next hour; it stops early once the queue is empty. Timetable: app/README.md.
# Needs the repository secrets DATABASE_URL (Neon, unpooled) and STEAM_API_KEY; SGDB_API_KEY and
# IGDB_CLIENT_ID/IGDB_CLIENT_SECRET are optional (cover fallbacks). Unlimited
# Actions minutes only while the repository is public: on a private one, run it by hand.
name: steam-details

on:
  schedule:
    - cron: "37 2-23/6 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to work (keep it short: the database stays awake meanwhile)"
        required: true
        default: "0.6"
      concurrency:
        description: "Games in flight at once"
        required: true
        default: "3"

# One worker at a time: a run that is still going makes the next one wait.
concurrency:
  group: steam-details
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # Scheduled runs: the window plus setup and the last batch. By hand: up to 5.5 h.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 350 || 60 }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Fill in Steam details
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          # Optional: portrait covers for games Steam has none of (empty secrets leave them off).
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          APP_URL: https://tralked.com
          HOURS: ${{ github.event.inputs.hours || vars.STEAM_DETAILS_HOURS || '0.6' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || vars.STEAM_DETAILS_CONCURRENCY || '3' }}
        run: |
          # Production mode asks for these two; the worker signs nothing, so throwaway values do.
          # A few games in flight hide the network wait of each game's writes (the runner is far from
          # the database in São Paulo); the store itself stays at one request every 1.5 s. More of
          # them make the Neon compute scale up, which spends its CU-hours faster.
          export SESSION_SECRET="$(openssl rand -hex 32)" CRON_SECRET="$(openssl rand -hex 16)"
          pnpm steam:details --hours "$HOURS" --concurrency "$CONCURRENCY"
